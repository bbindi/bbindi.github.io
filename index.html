<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official developer website for Tsk.R: Procrastinateless by Brixavier.">
  <title>Tsk.R: Procrastinateless — Brixavier</title>
  <style>
    :root { color-scheme: light; --ink:#17211d; --muted:#52615a; --green:#176b4d; --pale:#eaf4ee; }
    * { box-sizing:border-box }
    body { margin:0; font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:#f7faf8 }
    main { width:min(760px, calc(100% - 32px)); margin:10vh auto; }
    .card { padding:clamp(28px,6vw,56px); background:white; border:1px solid #dce8e0; border-radius:24px; box-shadow:0 18px 48px #18392a12 }
    .eyebrow { color:var(--green); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem }
    h1 { font-size:clamp(2.4rem,8vw,4.5rem); line-height:1.04; letter-spacing:-.055em; margin:.5rem 0 1rem }
    p { color:var(--muted); max-width:60ch }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px }
    a.button { padding:12px 18px; border-radius:12px; background:var(--green); color:white; text-decoration:none; font-weight:650 }
    a.link { padding:12px 4px; color:var(--green); font-weight:650 }
    footer { margin:22px 4px; color:var(--muted); font-size:.9rem }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow">Brixavier · Android apps</div>
      <h1 id="title">Tsk.R:<br>Procrastinateless</h1>
      <p>A practical productivity app for tasks, plans, and reminders. Your task and plan content stays on your device.</p>
      <nav aria-label="Resources">
        <a class="button" href="privacy-policy.html">Privacy policy</a>
        <a class="link" href="mailto:brixavier03@gmail.com">Contact developer</a>
      </nav>
    </section>
    <footer>© 2026 Brixavier</footer>
  </main>
</body>
</html>
